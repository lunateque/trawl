# Required: directory where the music library will live.
library_root = "D:/music"
# Required: contact address for the MusicBrainz User-Agent.
contact_email = "you@example.com"
# Optional: defaults to the platform's user data directory for trawl.
# data_dir = "D:/trawl-data"

[mb]
# Set to 0 to bypass cache reads.
cache_days = 30

[plan]
# Allowed primary release group types when expanding an artist.
types = ["album", "ep", "single"]
# Country priority; worldwide (XW) always comes first.
countries = ["XW", "US", "GB"]
# Prefer editions with fewer (original) or more (deluxe) tracks.
prefer = "original"
# Maximum release groups per manual artist want by default.
discography_limit = 14

[sources]
order = ["local", "ytmusic"]
# To enable Soulseek: order = ["local", "soulseek", "ytmusic"]
lossless_repack = true
album_coverage = 1.0
track_coverage = 0.0

[sources.soulseek]
download_dir = "" # required when soulseek is in order
concurrency = 3
search_timeout_s = 30
stall_timeout_s = 600
candidate_timeout_s = 3600

[sources.local]
inbox = []
move = false

[sources.ytmusic]
concurrency = 2

[verify]
acoustid_min_score = 0.80

[library]
template = "{albumartist}/{original_year} - {album}{disambiguation}/{disc_prefix}{track:02} - {title}.{ext}"

[lyrics]
enabled = true

[watch]
taste_every = "6h"
releases_every = "24h"
queue_every = "15m"
upgrade_every = "24h"
retry_missing_days = 7

[taste]
follow_max_tier = 2

[taste.listenbrainz]
user = ""
range = "all_time"
min_track_plays = 3

[taste.yandex]
likes = true
playlists = []

[taste.spotify]
likes = true
playlists = []

[taste.releases]
types = ["album", "ep"]

[[taste.tiers]]
min_plays = 6
scope = "discography"
limit = 14

[[taste.tiers]]
min_plays = 3
scope = "discography"
limit = 10

[[taste.tiers]]
min_plays = 2
scope = "discography"
limit = 3

[[taste.tiers]]
min_plays = 1
scope = "album"
limit = 1

[likes]
scope = "track"

[upgrade]
older_than_days = 14

[genres.map]

[genres.artist]

# In a separate secrets.toml beside this file:
# acoustid_key = "your application key"
# youtube_cookies = "cookies.txt" # optional
# slskd_url = "http://localhost:5030"
# slskd_api_key = "your slskd API key"
# slskd_allow_insecure = false # Prefer HTTPS for remote hosts; true sends the API key in plaintext.
# listenbrainz_token = "optional ListenBrainz token"
# yandex_token = "Yandex Music token"
# spotify_client_id = "Spotify application client ID"
# spotify_refresh_token is written by trawl auth spotify
