# Required: directory where the music library will live.
library_root = "D:/music"
# Required: contact address for the MusicBrainz User-Agent.
contact_email = "you@example.com"
# Optional: defaults to the platform's user data directory for trawl.
# data_dir = "D:/trawl-data"

[mb]
# Set to 0 to bypass cache reads.
cache_days = 30

[plan]
# Allowed primary release group types when expanding an artist.
types = ["album", "ep", "single"]
# Country priority; worldwide (XW) always comes first.
countries = ["XW", "US", "GB"]
# Prefer editions with fewer (original) or more (deluxe) tracks.
prefer = "original"
# Maximum release groups per manual artist want by default.
discography_limit = 14

[sources]
order = ["ytmusic"]

[sources.ytmusic]
concurrency = 2

[verify]
acoustid_min_score = 0.80

[library]
template = "{albumartist}/{original_year} - {album}{disambiguation}/{disc_prefix}{track:02} - {title}.{ext}"

[lyrics]
enabled = true

[run]
retry_missing_days = 7

[genres.map]

[genres.artist]

# In a separate secrets.toml beside this file:
# acoustid_key = "your application key"
# youtube_cookies = "cookies.txt" # optional
